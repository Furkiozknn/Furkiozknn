<text x="78" y="437" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="10.5" fill="#6b6b77">N backends at once</text>
<path d="M58 450 L70 450" stroke="#c9a961" stroke-opacity="0.3" stroke-width="1.4"/>
<text x="78" y="454" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">asset-provenance-toolkit</text>
<text x="78" y="467" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="10.5" fill="#6b6b77">provenance inside the file</text>
<text x="70" y="482" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">coupled only by that contract — no shared Python dependency</text>
<rect x="420" y="246" width="360" height="250" rx="14" fill="#101016" stroke="#242430"/>
<rect x="420" y="246" width="360" height="3" rx="1.5" fill="#6cb6ff" opacity="0.7"/>
<text x="438" y="276" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#6cb6ff">MCP servers, and a census of them</text>
<text x="450" y="502" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77"></text>
<text x="450" y="306" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">mini-creative-toolkit</text>
<text x="452" y="321" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">23 CPU-first media tools</text>
<text x="450" y="340" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">local-notes-search-mcp</text>
<text x="452" y="355" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">your own files, no network</text>
<text x="450" y="374" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">nvidia-nim-mcp</text>
<text x="452" y="389" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">seven tools on a free tier</text>
<text x="450" y="408" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">voice-io-mcp</text>
<text x="452" y="423" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">speech in and out, no key</text>
<text x="450" y="442" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">mcp-census</text>
<text x="452" y="457" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">how many servers are there, really</text>
<rect x="800" y="246" width="360" height="250" rx="14" fill="#101016" stroke="#242430"/>
<rect x="800" y="246" width="360" height="3" rx="1.5" fill="#e19bd0" opacity="0.7"/>
<text x="818" y="276" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#e19bd0">Things you can open and use</text>
<text x="830" y="306" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">nova-drift</text>
<text x="832" y="321" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">browser space-runner, live</text>
<text x="830" y="340" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">buradane</text>
<text x="832" y="355" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">167,829 OpenStreetMap places</text>
<text x="830" y="374" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">masal</text>
<text x="832" y="389" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">a bedtime story, live</text>
<text x="830" y="408" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">turkce-ajanlar</text>
<text x="832" y="423" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">70 sub-agents, searchable</text>
<text x="830" y="442" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">4 Godot games + a starter</text>
<text x="832" y="457" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">853, 841, 460 and 115 checks</text>
