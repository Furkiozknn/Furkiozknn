<text x="78" y="377" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="10.5" fill="#6b6b77">templates in git</text>
<path d="M58 390 L70 390" stroke="#c9a961" stroke-opacity="0.3" stroke-width="1.4"/>
<text x="78" y="394" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#d8d8e0">ai-workflow-engine</text>
<text x="78" y="407" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="10.5" fill="#6b6b77">pipelines as YAML DAGs</text>
<path d="M58 420 L70 420" stroke="#c9a961" stroke-opacity="0.3" stroke-width="1.4"/>
