<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="How the repositories fit together: a verification layer that checks the other repositories, a generation pipeline of four tools around one gateway contract, a set of MCP servers, the Godot games and web apps, and a metadata file in every repository that a daily audit re-derives">
<defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#17161d"/><stop offset="60%" stop-color="#0e0d12"/><stop offset="100%" stop-color="#0b0b0f"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b77"/></marker></defs>
<rect width="1200" height="660" fill="url(#bg)"/>
<text x="40" y="52" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-weight="700" font-size="26" fill="#c9a961">How these repositories hold each other up</text>
<text x="41" y="78" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="14" fill="#9a9aa6">Grouped by what they do, not by when they were written. Every number below is one this account can re-derive.</text>
<rect x="40" y="100" width="1120" height="104" rx="14" fill="#101016" stroke="#242430"/>
<rect x="40" y="100" width="1120" height="3" rx="1.5" fill="#4ade9e" opacity="0.7"/>
<text x="58" y="130" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#4ade9e">Tools that check other work — each one calibrated against real outside projects</text>
<rect x="150" y="136" width="91" height="32" rx="9" fill="#141419" stroke="#4ade9e" stroke-opacity="0.55"/>
<text x="195" y="157" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4ade9e">repo-vet</text>
<text x="195" y="186" text-anchor="middle" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">GitHub repositories</text>
<rect x="424" y="136" width="83" height="32" rx="9" fill="#141419" stroke="#4ade9e" stroke-opacity="0.55"/>
<text x="465" y="157" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4ade9e">mcp-vet</text>
<text x="465" y="186" text-anchor="middle" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">MCP servers, before you install one</text>
<rect x="665" y="136" width="140" height="32" rx="9" fill="#141419" stroke="#4ade9e" stroke-opacity="0.55"/>
<text x="735" y="157" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4ade9e">godot-refcheck</text>
<text x="735" y="186" text-anchor="middle" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">Godot 3 and 4 projects</text>
<rect x="894" y="136" width="222" height="32" rx="9" fill="#141419" stroke="#4ade9e" stroke-opacity="0.55"/>
<text x="1005" y="157" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4ade9e">claude-code-intelligence</text>
<text x="1005" y="186" text-anchor="middle" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">token spend, locally</text>
<rect x="40" y="246" width="360" height="250" rx="14" fill="#101016" stroke="#242430"/>
<rect x="40" y="246" width="360" height="3" rx="1.5" fill="#c9a961" opacity="0.7"/>
<text x="58" y="276" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#c9a961">Generation pipeline</text>
<rect x="70" y="290" width="300" height="32" rx="9" fill="#141419" stroke="#c9a961" stroke-opacity="0.6"/>
<text x="220" y="311" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#c9a961">ai-job-gateway</text>
<text x="220" y="338" text-anchor="middle" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="11" fill="#6b6b77">one async job contract, over HTTP</text>
