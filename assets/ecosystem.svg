<text x="58" y="570" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#c9a961">project-meta.json in all 27 repositories</text>
<text x="1138" y="570" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#4ade9e">furkiozknn.github.io renders this same metadata</text>
<text x="62" y="590" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="12.5" fill="#c7c2b6">One schema, one validator, and an audit that runs every morning over the GitHub API.</text>
<text x="62" y="609" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="12.5" fill="#c7c2b6">It re-derives every published number from the run that printed it, and opens an issue the day a repository drifts.</text>
