<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Furki Ozkan - hobby developer, a few projects at a time" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="82%">
      <stop offset="0%" stop-color="#17161d"/>
      <stop offset="55%" stop-color="#0e0d12"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2efe6"/>
      <stop offset="55%" stop-color="#e7dcc0"/>
      <stop offset="100%" stop-color="#c9a961"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a961" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a961" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- one coordinator, many components, calls in one direction: the shape of the work -->
  <g opacity="0.5">
    <g stroke="#33333f" stroke-width="1" fill="none">
      <path d="M600 108 L300 52"/><path d="M600 108 L900 52"/>
      <path d="M600 108 L176 118"/><path d="M600 108 L1024 118"/>
      <path d="M600 108 L246 186"/><path d="M600 108 L954 186"/>
      <path d="M600 108 L420 214"/><path d="M600 108 L780 214"/>
    </g>
    <g fill="#5a5a68">
      <circle cx="176" cy="118" r="3.5"/><circle cx="246" cy="186" r="3.5"/>
      <circle cx="420" cy="214" r="3.5"/><circle cx="780" cy="214" r="3.5"/>
      <circle cx="954" cy="186" r="3.5"/><circle cx="1024" cy="118" r="3.5"/>
    </g>
  </g>
  <g filter="url(#glow)">
    <circle cx="300" cy="52" r="4.5" fill="#6cb6ff"/>
    <circle cx="900" cy="52" r="4.5" fill="#e857c3"/>
    <circle cx="176" cy="118" r="4" fill="#4ade9e"/>
    <circle cx="1024" cy="118" r="4" fill="#f0883e"/>
    <circle cx="600" cy="108" r="6.5" fill="#c9a961"/>
  </g>

  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-weight="600" font-size="13" letter-spacing="6" fill="#c9a961" opacity="0.85">INDEPENDENT DEVELOPER · AGENT SYSTEMS &amp; TOOLING</text>

  <text x="600" y="256" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="url(#nameGrad)" filter="url(#softglow)" letter-spacing="1">Furki Özkan</text>

  <text x="600" y="298" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="18" fill="#c7c2b6" opacity="0.88">Ajan sistemleri, Claude Code araçları, MCP sunucuları ve arada tarayıcı oyunları.</text>

  <g font-family="'Cascadia Code','Consolas',monospace" font-size="12">
    <g>
      <rect x="356" y="326" width="140" height="40" rx="8" fill="#141419" stroke="#2a2a33"/>
      <text x="376" y="346" fill="#c9a961" font-size="17">16</text>
      <text x="402" y="346" fill="#9a9aa6" font-size="12">proje</text>
      <text x="376" y="360" fill="#6b6b77" font-size="10">hepsinde test var</text>
    </g>
    <g>
      <rect x="510" y="326" width="180" height="40" rx="8" fill="#141419" stroke="#2a2a33"/>
      <text x="530" y="346" fill="#4ade9e" font-size="17">2.165</text>
      <text x="588" y="346" fill="#9a9aa6" font-size="12">test</text>
      <text x="530" y="360" fill="#6b6b77" font-size="10">16 depodan sayıldı</text>
    </g>
    <g>
      <rect x="704" y="326" width="140" height="40" rx="8" fill="#141419" stroke="#2a2a33"/>
      <text x="724" y="346" fill="#6cb6ff" font-size="17">569</text>
      <text x="760" y="346" fill="#9a9aa6" font-size="12">commit</text>
      <text x="724" y="360" fill="#6b6b77" font-size="10">15 Eylül 2026</text>
    </g>
  </g>

  <line x1="440" y1="388" x2="760" y2="388" stroke="url(#hair)" stroke-width="1"/>
</svg>
