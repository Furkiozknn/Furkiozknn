# SkillSpector baseline: .claude/skills icin tek tek incelenmis bulgular.
#
# Buradaki her kayit bir insan/ajan tarafindan satiri okunarak incelendi ve
# gerekcesi yazildi. Kural: yalnizca yanlis pozitif ya da tarayicinin kendi
# kapsam uyarisi (AE1) buraya girer; gercek bir bulgu bastirilmaz, duzeltilir.
# Glob `rules` bilerek bos: kural ya da dosya bazli toplu bastirma yok.
#
# Parmak izleri tamdir: SkillSpector surumune, dosya yoluna ve dosyanin tam
# metnine baglidir. Skill dosyasi ya da tarayici pini degisince kayit eslesmez,
# bulgu yeniden aktif olur ve kapi (tara.py) eskimis kaydi da hata sayar.
# Yeniden uretim: `skillspector baseline <skill> --no-llm -o <gecici>` ile
# parmak izlerini al, her birini yeniden incele, gerekcesiyle buraya tasi.
# MEDIUM/LOW bulgular burada YOK: kapiyi dusurmezler ve her kosuda listelenirler.
#
# `file` alani bilgi amaclidir (skill/dosya); eslesme yalnizca `hash` iledir.
