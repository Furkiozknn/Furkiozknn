name: projeler

# Her deponun kendi project-meta.json'unu tek bir dizine toplar ve
# topladigi her dosyayi semaya karsi denetler.
#
# Bilerek SADECE elle tetikleniyor (workflow_dispatch) ve sonucu depoya
# COMMIT ETMIYOR. Iki sebep:
#   1. Islenmis bir projects.json, bir sonraki push'ta eskiyor; eskimis bir
#      dizin, hic dizin olmamasindan kotudur.
#   2. Haftalik bir bot commit'i katki grafigini gercek olmayan bir emekle
#      sisirirdi. Bu hesapta sayilar oyle uretilmiyor.
#
# Cikti "Artifacts" altinda indirilebilir bir dosya olarak duruyor; ayni
# betik yerelde de calisiyor: python3 schema/derle.py
#
# derle.py sema ihlali gorurse 1 ile cikar, yani bu is akisi kirmizi yanar.
# Dosya sistemi yarisi (medya/docs yollari gercekten var mi) burada
# kosulamaz: derle.py API uzerinden okuyor, calisma agaci elinde yok.
# O yarisi icin klonlarin yaninda: python3 schema/dogrula.py --kok <klasor>

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bagimlilik yok: betik yalnizca standart kutuphane kullaniyor.
      - name: Dizini uret ve semaya karsi denetle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 schema/derle.py

      - name: Ozet
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("schema/projects.json", encoding="utf-8"))
          print(f"{d['count']} proje, {len(d['missing'])} eksik, "
                f"{len(d['schema_violations'])} sema ihlali, uretim {d['generated_at']}")
          print("sema denetimi:", "acik" if d["schema_checked"] else "ATLANDI")
          for m in d["missing"]:
              print("  eksik:", m["id"], "-", m["reason"])
          for b in d["schema_violations"]:
              print("  ihlal:", b["id"], b["hatalar"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: projects-json
          path: schema/projects.json
          if-no-files-found: error
