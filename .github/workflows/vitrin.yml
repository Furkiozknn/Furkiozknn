name: vitrin

# Profilin "Recently" bolumu: son yazilar (yazilar/) ve her deponun en son
# surumu (GitHub API). Gunde bir kez ve yazilar/ degistiginde yeniden uretir,
# yalnizca bir fark varsa commit eder.
#
# Commit'i github-actions[bot] atar: bu otomatik bir tazeleme, bir insanin
# katkisi degil, katki grafiginde de oyle gorunmemeli.

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: ["yazilar/**", "schema/vitrin.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitrin
  cancel-in-progress: false

jobs:
  tazele:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recently bolumunu uret
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 schema/vitrin.py

      - name: Fark varsa commit et
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "degisiklik yok"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "vitrin: Recently bolumu yenilendi"
          git push
