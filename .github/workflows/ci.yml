name: CI

# Bu depo artik bir arac deposu: schema/ altindaki betikler haftada bir
# 24 deponun icine yaziyor ve her gun neyin bozuk oldugunu soyluyor.
# Boyle bir seyin testsiz push edilmesi, otomasyonu bir riske cevirir.
#
# Uc kapi, hepsi her push'ta:
#   1. schema/ testleri (bagimliliksiz unittest)
#   2. bu deponun KENDI project-meta.json'u hem semaya hem depoya uyuyor mu
#   3. .github/workflows/ altindaki her YAML ayristirilabiliyor mu
#
# Ucuncusu bos bir formalite degil: gecersiz bir workflow YAML'i GitHub'da
# hic is uretmeden "failure" olur -- job listesi bos, log yok, annotation
# yok. Bir kez `run: |` blogunun icine girintisiz bir satir kacti ve
# tespiti dakikalar aldi.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kapilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyyaml: is akisi YAML'lerini ayristirmak icin (testler ve
      # schema/politika.py). Surum sabit: CI'da kosan kod her gun ayni olmali.
      - name: pyyaml
        run: python3 -m pip install --quiet pyyaml==6.0.3

      - name: schema testleri
        run: python3 schema/test_schema.py

      - name: Kendi metadata'si
        run: python3 schema/dogrula.py "$GITHUB_WORKSPACE"

      # Bir sayi yedi yerde duruyor (bu dosyalarin tablolari, basliklari,
      # rozetler, tanitim cumleleri, hero.svg). Gunluk denetim bunlarin bir
      # kismina bakiyor ama TESTLER.md'nin KENDI tablo satirlarina hic
      # bakmiyordu ve hicbirini duzeltemiyor. Bu kapi agsiz: yalnizca
      # "hepsi ayni seyi mi soyluyor" diye soruyor.
      - name: Yayimlanan sayilar tutarli mi
        run: python3 schema/testler.py --kontrol

      # "Recently" bolumu yazilar/'dan uretiliyor. Elle duzenlenip
      # yazilarla ayrisirsa ya da yeni bir yazi README'ye hic girmezse, bu
      # kapi kirmizi olur. Agsiz: surum satirlarina dokunmaz.
      - name: Recently bolumu yazilar/ ile ayni mi
        run: python3 schema/vitrin.py --kontrol

      # Depo aciklamalari about/about.json'da; burada yalnizca kurallara
      # uyup uymadigi soruluyor (uzunluk, tam cumle, https). Agsiz.
      - name: About metinleri kurallara uyuyor mu
        run: python3 about/uygula.py --kontrol

      # Butun depolarin is akislarina uygulanan kurallar (zaman siniri,
      # SHA'li ucuncu taraf action, pipefail, izinler, Dependabot).
      # Kurallari koyan depo onlara ilk uyan olmali: --kati WARN'da da kirmizi.
      - name: Is akisi politikasi (bu depo)
        run: python3 schema/politika.py --depo . --kati

      - name: Is akisi YAML'leri
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          hata = 0
          dosyalar = sorted(glob.glob(".github/workflows/*.y*ml"))
          for p in dosyalar:
              try:
                  d = yaml.safe_load(open(p, encoding="utf-8").read())
              except Exception as e:
                  print("HATA   %s  %s" % (p, str(e).replace("\n", " ")[:200]))
                  hata += 1
                  continue
              if not isinstance(d, dict) or "jobs" not in d:
                  print("HATA   %s  (jobs yok)" % p)
                  hata += 1
              # PyYAML `on:` anahtarini True'ya cevirir (YAML 1.1 mirasi).
              elif True not in d and "on" not in d:
                  print("HATA   %s  (tetikleyici yok)" % p)
                  hata += 1
          print("taranan: %d dosya, hata: %d" % (len(dosyalar), hata))
          sys.exit(1 if hata else 0)
          PY
