name: denetim

# Hesap capinda gunluk oz-denetim.
#
# Bu is akisi, ekosistemin tek bir Windows makinesine bagli kalmamasi
# icin var. Daha once "her depo dogru mu" sorusunu yalnizca o makinedeki
# betikler soruyordu; makine kapaliyken kimse sormuyordu. Artik GitHub
# kendi kendine soruyor.
#
# Hicbir seyi duzeltmez, hicbir seye commit atmaz. Yalnizca olcer ve
# tek bir "Ekosistem denetimi" konusuna yazar:
#   - bulgu varsa ve bulgu KUMESI degistiyse  -> yorum dusurur
#   - bulgu varsa ama ayni kume duruyorsa     -> susar (365 ayni yorum yok)
#   - bulgu yoksa ve konu aciksa              -> kapanis yorumu + kapatir
#   - bulgu yoksa ve konu yoksa               -> hic ses cikarmaz
#
# Kirmizi yanmaz: baska bir deponun eksigi bu deponun rozetini
# bozmamali. Sinyal konudur, rozet degil.

on:
  schedule:
    # Her gun 05:00 UTC. Haftalik ozetten (pazartesi 06:00) once kossun ki
    # ozet yazilirken ayrisma zaten bilinsin.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: denetim
  cancel-in-progress: false

jobs:
  denetle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Is akisi politikasi (schema/politika.py) YAML okuyor; o tek bagimlilik
      # icin pyyaml, surumu sabit. Kurulamazsa denetim yine kosar ve raporun
      # basinda politikaya kac depoda BAKILAMADIGINI yazar.
      - name: pyyaml
        run: python3 -m pip install --quiet pyyaml==6.0.3

      # Geri kalan her sey standart kutuphane.
      # DEPO_OKUMA tanimliysa kosu loglari da okunabiliyor, yani
      # "yayimlanan test sayisi hala kosunun yazdigi sayi mi" sorusu
      # gercekten soruluyor. Tanimli degilse denetim yine kosuyor ama
      # raporun basinda kac deponun sayisina BAKILAMADIGI yaziyor --
      # bakilamayan bir sayi temiz degildir, ve bu satir eklenene kadar
      # o kontrol her gun sessizce atlaniyordu.
      - name: Denetim
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPO_OKUMA: ${{ secrets.DEPO_OKUMA }}
        run: |
          set -euo pipefail
          python3 schema/denetim.py | tee denetim.md

      - uses: actions/upload-artifact@v4
        with:
          name: denetim
          path: |
            schema/denetim.json
            denetim.md
          if-no-files-found: error

      - name: Konuyu guncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sayi=$(python3 -c "import json;print(json.load(open('schema/denetim.json',encoding='utf-8'))['finding_count'])")
          parmak=$(python3 -c "import json;print(json.load(open('schema/denetim.json',encoding='utf-8'))['fingerprint'])")
          baslik="Ekosistem denetimi"

          # Kapali olanlar dahil aranir: her turda yeni bir konu acmak
          # yerine hep ayni konu yeniden acilir. Bir yil sonra elli konu
          # degil, gecmisi tek yerde duran bir konu olsun.
          kayit=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
                    --search "$baslik in:title" --json number,title,state \
                    --jq "[.[] | select(.title == \"$baslik\")] | sort_by(.number) | last")
          numara=$(printf '%s' "$kayit" | python3 -c "import json,sys;d=sys.stdin.read().strip();print(json.loads(d)['number'] if d and d!='null' else '')")
          durum=$(printf '%s' "$kayit" | python3 -c "import json,sys;d=sys.stdin.read().strip();print(json.loads(d)['state'] if d and d!='null' else '')")

          if [ "$sayi" = "0" ]; then
            if [ -z "$numara" ] || [ "$durum" = "CLOSED" ]; then
              echo "Temiz; acilacak bir konu yok."
              exit 0
            fi
            {
              echo "Denetim temiz: $(date -u '+%Y-%m-%d') kosusunda bulgu kalmadi."
              echo "Konu kapaniyor; yeni bir bulgu cikarsa bir sonraki kosu yenisini acar."
              echo
              echo "<sub>schema/denetim.py, ${GITHUB_RUN_ID} kosusundan.</sub>"
            } > kapanis.md
            gh issue comment "$numara" --repo "$GITHUB_REPOSITORY" --body-file kapanis.md
            gh issue close "$numara" --repo "$GITHUB_REPOSITORY"
            echo "temiz -> #$numara kapatildi"
            exit 0
          fi

          {
            echo "### $(date -u '+%Y-%m-%d') denetimi"
            echo
            cat denetim.md
            echo
            echo "---"
            echo "<sub>schema/denetim.py, ${GITHUB_RUN_ID} kosusundan. Hicbir bulgu otomatik duzeltilmedi.</sub>"
            echo "<!-- parmak: ${parmak} -->"
          } > yorum.md

          if [ -z "$numara" ]; then
            numara=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$baslik" \
              --body-file yorum.md | sed 's#.*/##')
            echo "konu acildi: #$numara"
            exit 0
          fi

          if [ "$durum" = "CLOSED" ]; then
            gh issue reopen "$numara" --repo "$GITHUB_REPOSITORY"
            gh issue comment "$numara" --repo "$GITHUB_REPOSITORY" --body-file yorum.md
            echo "konu yeniden acildi: #$numara"
            exit 0
          fi

          son=$(gh issue view "$numara" --repo "$GITHUB_REPOSITORY" \
                  --json body,comments --jq '[.body] + [.comments[].body] | last')
          onceki=$(printf '%s' "$son" | grep -o 'parmak: [0-9a-f]*' | tail -1 | awk '{print $2}' || true)
          if [ "${onceki:-}" = "$parmak" ]; then
            echo "Bulgu kumesi degismedi ($parmak); yorum yazilmiyor."
            exit 0
          fi
          gh issue comment "$numara" --repo "$GITHUB_REPOSITORY" --body-file yorum.md
          echo "yorum dusuldu: #$numara"
